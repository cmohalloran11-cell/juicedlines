<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juiced — Sports Betting Edges</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23080b05'/%3E%3Cpath d='M58 8 L24 54 H46 L40 92 L78 40 H54 Z' fill='%23b6f01a'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0a0e09;--panel:#111710;--line:#1e281c;--line2:#273222;--text:#e9f0e6;--muted:#8b978a;
  --dim:#5c675a;--accent:#c6f24e;--accent2:#a6e02a;--up:#8ee65a;--down:#ff6b6b;--warn:#e8c84a;--purple:#a06bff;
}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
/* 2026-08 (production-readiness audit, accessibility): the app had zero :focus rules
   anywhere -- a keyboard user tabbing through had no visible indication of where they
   were. :focus-visible (not bare :focus) so mouse clicks don't show a distracting ring,
   only actual keyboard/assistive-tech navigation does -- the modern standard for this. */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;transition:grid-template-columns .2s ease}
.side{background:linear-gradient(180deg,#0c110b,#090d08);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 14px;font-weight:900;letter-spacing:-.5px;font-size:19px}
.brand .logo{display:flex;align-items:center;gap:4px}
.brand .bolt{color:var(--accent)}.brand .collapse{color:var(--dim);cursor:pointer;font-size:16px;user-select:none;transition:.15s}.brand .collapse:hover{color:var(--accent)}
.navhdr{font-size:9.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--dim);padding:13px 12px 5px}
.navbottom{border-top:1px solid var(--line);padding:6px 10px}
.ver{padding:6px 16px 12px;color:var(--dim);font-size:10.5px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
/* collapsed rail */
.app.collapsed{grid-template-columns:66px 1fr}
.app.collapsed .nav a span,.app.collapsed .navbottom a span,.app.collapsed .badge,.app.collapsed .navhdr span,.app.collapsed .wordmark,.app.collapsed .ver span{display:none}
.app.collapsed .plan{display:none}
.app.collapsed .nav a,.app.collapsed .navbottom a{justify-content:center;padding:10px 0}
.app.collapsed .navhdr{padding:9px 0 4px;text-align:center}
.app.collapsed .navhdr::before{content:'';display:block;height:1px;background:var(--line2);margin:0 14px}
.app.collapsed .brand{justify-content:center;padding:18px 0 14px}
.app.collapsed .ver{text-align:center;padding:6px 0 12px}
.nav{flex:1;overflow-y:auto;padding:6px 10px}
.nav::-webkit-scrollbar{width:6px}.nav::-webkit-scrollbar-thumb{background:#1c261a;border-radius:3px}
.nav a,.navbottom a{display:flex;align-items:center;gap:11px;padding:8.5px 11px;border-radius:9px;color:var(--muted);font-weight:600;font-size:12.7px;margin:1px 0;transition:.12s;cursor:pointer}
.nav a:hover,.navbottom a:hover{background:#131a11;color:var(--text)}
.nav a.active,.navbottom a.active{background:linear-gradient(90deg,#1b2416,#141b11);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.nav a.active svg,.navbottom a.active svg{color:var(--accent)}
.nav svg,.navbottom svg{width:16px;height:16px;flex:0 0 16px;color:var(--dim)}.nav a:hover svg,.navbottom a:hover svg{color:var(--muted)}
.badge{margin-left:auto;font-size:9.5px;font-weight:800;padding:1.5px 6px;border-radius:20px;background:var(--accent);color:#0a120a}
.badge.pro{background:#2a3720;color:var(--accent)}
.plan{margin:10px;padding:13px;border:1px solid var(--line2);border-radius:12px;background:#0e130d}
.plan .t{display:flex;gap:8px;font-weight:800;font-size:12.5px}.plan .s{color:var(--muted);font-size:11px;margin:3px 0 10px}
.plan button{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line2);background:#141b11;color:var(--text);font-weight:700;font-size:11.5px;cursor:pointer}
.plan button:hover{border-color:var(--accent);color:var(--accent)}
.main{min-width:0}
.topbar{display:flex;align-items:center;gap:18px;padding:18px 26px 6px}
.hello h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.4px;display:flex;gap:8px}
.hello p{margin:2px 0 0;color:var(--muted);font-size:13px}
.search{flex:1;max-width:520px;margin:0 auto;position:relative}
.search input{width:100%;padding:10px 14px 10px 38px;border-radius:11px;border:1px solid var(--line2);background:#0e130d;color:var(--text);font-size:13px}
.search input::placeholder{color:var(--dim)}
.search svg{position:absolute;left:12px;top:11px;width:15px;height:15px;color:var(--dim)}
.search kbd{position:absolute;right:10px;top:9px;font-size:10px;color:var(--dim);border:1px solid var(--line2);border-radius:5px;padding:2px 5px}
.topright{display:flex;align-items:center;gap:14px}
.aijuice{display:flex;gap:7px}.aijuice .lbl{color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase}.aijuice .val{color:var(--accent);font-size:15px;font-weight:800}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2a3720,#141b11);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer}
.view{padding:8px 26px 50px}
.grid2{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}
.tabs{display:flex;gap:6px;margin:6px 0 18px;flex-wrap:wrap}
.tab{display:flex;align-items:center;gap:7px;padding:8px 15px;border-radius:10px;border:1px solid var(--line2);background:#0e130d;color:var(--muted);font-weight:700;font-size:12.5px;cursor:pointer}
.tab:hover{color:var(--text)}.tab.active{background:linear-gradient(180deg,#1c2616,#151d12);color:var(--accent);border-color:#31401f}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.tile{border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(180deg,#101610,#0d120c);position:relative;overflow:hidden;min-height:104px}
.tile .cap{color:var(--muted);font-size:11px;margin-bottom:6px}.tile .big{font-size:25px;font-weight:900;letter-spacing:-1px;line-height:1}
.tile .sub{color:var(--muted);font-size:11px;margin-top:8px}.tile .sub b{color:var(--text)}
.tile .ph{position:absolute;right:12px;bottom:10px;width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--line2);background:#0a0e09}
.tile.meter .bar{height:7px;border-radius:5px;background:#1a2416;margin-top:12px;overflow:hidden}.tile.meter .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.pos{color:var(--accent)}.neg{color:var(--down)}
.panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:16px}
.phead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.phead h3{margin:0;font-size:15px;font-weight:800}.phead .hint{color:var(--muted);font-size:11.5px;font-weight:500;margin-left:8px}
.phead a,.phead .lnk{color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer}.phead a:hover,.phead .lnk:hover{color:var(--accent)}
table{width:100%;border-collapse:collapse}
.drops th{text-align:left;color:var(--dim);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:8px 14px;border-bottom:1px solid var(--line)}
.drops td{padding:10px 14px;vertical-align:middle}
.drops tr:not(:last-child) td{border-bottom:1px solid #14190f}.drops tbody tr{cursor:pointer}.drops tbody tr:hover td{background:#0f150d}
.pl{display:flex;align-items:center;gap:10px}.pl img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#0a0e09;border:1px solid var(--line2)}
.pl .nm{font-weight:700}.pl .tm{color:var(--muted);font-size:10.5px}
.prop .p1{font-weight:600}.prop .p2{color:var(--muted);font-size:10.5px}.mono{font-variant-numeric:tabular-nums}
.js{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;font-weight:800;font-size:12px}
.conf{display:flex;align-items:center;gap:8px;min-width:110px}.conf .track{flex:1;height:6px;border-radius:4px;background:#1a2416;overflow:hidden}.conf .track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.star{color:var(--dim);cursor:pointer;font-size:15px}.star:hover,.star.on{color:var(--warn)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.spark{width:100%;height:150px}
.donutwrap{display:flex;align-items:center;gap:18px;padding:6px 16px 16px}.legend{flex:1;display:flex;flex-direction:column;gap:7px}.legend .row{display:flex;gap:8px;font-size:12px}.legend .dot{width:9px;height:9px;border-radius:3px}.legend .pct{margin-left:auto;color:var(--muted);font-weight:700}
.rcard{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:16px}
.rhead{display:flex;align-items:center;justify-content:space-between;padding:13px 15px 9px}.rhead h4{margin:0;font-size:13.5px;font-weight:800;display:flex;gap:7px}.rhead .n{color:var(--muted)}.rhead a,.rhead .lnk{color:var(--muted);font-size:11px;font-weight:700;cursor:pointer}
.alert{display:flex;gap:10px;padding:10px 15px;border-top:1px solid #14190f}.alert .ai{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:0 0 26px;font-size:13px}
.alert .h{font-weight:700;font-size:12px}.alert .d{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.alert .t{color:var(--dim);font-size:10.5px;white-space:nowrap}
.mtabs{display:flex;gap:4px;padding:0 12px 8px}.mtab{font-size:10.5px;font-weight:700;color:var(--dim);padding:4px 8px;border-radius:6px;cursor:pointer}.mtab.active{background:#161d12;color:var(--accent)}
.mv{display:flex;align-items:center;gap:9px;padding:8px 15px;border-top:1px solid #14190f}.mv .rk{color:var(--dim);font-weight:800;width:12px;font-size:11px}.mv .nm{font-weight:700;font-size:12px}.mv .sub{color:var(--muted);font-size:10.5px}.mv .mval{margin-left:auto;font-weight:800;font-size:12px}
.gm{display:flex;align-items:center;gap:10px;padding:9px 15px;border-top:1px solid #14190f;font-size:12px}.gm .lg{width:22px;height:22px;border-radius:5px;background:#0e130d;display:flex;align-items:center;justify-content:center}.gm .g{font-weight:700}.gm .lbl{color:var(--muted);font-size:10.5px}.gm .tm2{margin-left:auto;color:var(--muted);font-weight:600}
.ai-sum{border:1px solid var(--line2);border-radius:14px;background:linear-gradient(120deg,#111a10,#0e130d);padding:16px;display:flex;gap:14px;align-items:flex-start}.ai-sum .orb{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#2a3720,#141b11);display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:900;flex:0 0 30px}.ai-sum h4{margin:0 0 4px;font-size:14px}.ai-sum p{margin:0;color:var(--muted);font-size:12.5px;max-width:640px}.ai-sum .btn{margin-left:auto;background:linear-gradient(135deg,#7c4dff,#b06bff);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap}
.muted{color:var(--muted)}.skel{color:var(--dim)}.center{text-align:center}
/* page header */
.ph2{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 0 16px}.ph2 h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.3px}.ph2 p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
select,.ctl{padding:8px 12px;border-radius:9px;border:1px solid var(--line2);background:#0e130d;color:var(--text);font-size:12.5px;font-weight:600}
.btn{padding:8px 14px;border-radius:9px;border:1px solid var(--line2);background:#141b11;color:var(--text);font-weight:700;font-size:12px;cursor:pointer}.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:#0a120a;border-color:var(--accent)}.btn.pri:hover{background:var(--accent2);color:#0a120a}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:800;background:#161d12;color:var(--muted)}
.chip.g{background:#16240f;color:var(--accent)}.chip.r{background:#241010;color:var(--down)}.chip.y{background:#241f0f;color:var(--warn)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kv .b{border:1px solid var(--line);border-radius:11px;padding:12px;background:#0e130d;min-width:0}.kv .b .l{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}.kv .b .v{font-size:20px;font-weight:800;margin-top:3px}
.empty{padding:60px 20px;text-align:center;color:var(--dim)}.empty .em{font-size:30px;margin-bottom:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.learn-card{border:1px solid var(--line);border-radius:12px;padding:16px;background:#0e130d}.learn-card h4{margin:0 0 6px}.learn-card p{margin:0;color:var(--muted);font-size:12.5px}
/* ── dashboard redesign: "what should I bet today" ── */
.sec-hd{display:flex;align-items:flex-end;justify-content:space-between;margin:24px 0 12px}
.sec-hd h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.3px}
.sec-hd p{margin:2px 0 0;color:var(--muted);font-size:12px}
.hero-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:1350px){.hero-row{grid-template-columns:repeat(2,1fr)}}
.hero{border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(180deg,#111710,#0d120c);position:relative;overflow:hidden;min-height:112px}
.hero.accent{background:linear-gradient(155deg,#182310,#0d120c);border-color:#31401f}
.hero.purple{background:linear-gradient(155deg,#1c1428,#120d18);border-color:#3a2a55}
.hero .cap{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.hero .big{font-size:23px;font-weight:900;letter-spacing:-.7px;line-height:1.15;margin-top:7px}
.hero .sub{color:var(--muted);font-size:11.5px;margin-top:7px;line-height:1.4;max-width:calc(100% - 44px)}
.hero .sub b{color:var(--text)}
.hero .ph{position:absolute;right:12px;bottom:12px;width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--line2);background:#0a0e09}
.entries-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.entry-card{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:9px}
.entry-card .ehd{display:flex;align-items:center;justify-content:space-between}
.entry-card .ehd .lbl{font-weight:800;font-size:13.5px}
.entry-card .stack{display:flex}
.entry-card .stack img{width:22px;height:22px;border-radius:50%;object-fit:cover;border:2px solid var(--panel);background:#0a0e09;margin-left:-7px}
.entry-card .stack img:first-child{margin-left:0}
.entry-card .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.entry-card .row b{color:var(--text);font-weight:800}
.play-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.play-card{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:15px;display:flex;flex-direction:column;gap:10px}
.play-card .phd{display:flex;align-items:center;gap:10px}
.play-card .phd img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#0a0e09;border:1px solid var(--line2)}
.play-card .phd .nm{font-weight:800;font-size:13.5px}
.play-card .phd .sub{color:var(--muted);font-size:11px}
.play-card .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.play-card .m{background:#0e130d;border:1px solid var(--line);border-radius:9px;padding:7px 8px}
.play-card .m .l{color:var(--dim);font-size:9px;text-transform:uppercase;font-weight:700;letter-spacing:.3px}
.play-card .m .v{font-size:14px;font-weight:800;margin-top:2px}
.play-card .why{background:#0e130d;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:11.5px;color:var(--muted)}
.play-card .why b{color:var(--text)}
.play-card .aibox2{border:1px dashed var(--line2);border-radius:9px;padding:9px 10px;font-size:11.5px;color:var(--muted);cursor:pointer}
.play-card .aibox2:hover{border-color:var(--accent);color:var(--text)}
.market-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.mk-row{display:flex;align-items:center;gap:9px;padding:8px 15px;border-top:1px solid #14190f;font-size:12px}
.mk-row:first-child{border-top:0}
.mk-row .nm{font-weight:700}.mk-row .sub{color:var(--muted);font-size:10.5px}
.mk-row .val{margin-left:auto;font-weight:800;font-size:12px}
.bankroll-card{border:1px solid var(--line2);border-radius:14px;background:linear-gradient(120deg,#111a10,#0e130d);padding:18px}
.bk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-top:14px}
.bk-item .l{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px}
.bk-item .v{font-size:19px;font-weight:800;margin-top:4px}
.bk-item .v.sm{font-size:14px}
.bk-set{display:flex;gap:8px;align-items:center}
.bk-set input{width:130px;padding:7px 10px;border-radius:8px;border:1px solid var(--line2);background:#0e130d;color:var(--text);font-size:12.5px}
.coach-card{border:1px solid var(--line2);border-radius:14px;background:linear-gradient(120deg,#161020,#0e130d);padding:18px;display:flex;gap:14px;align-items:flex-start}
.coach-card .orb{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3a2a55,#1c1428);display:flex;align-items:center;justify-content:center;color:var(--purple);font-weight:900;flex:0 0 34px}
.coach-card h4{margin:0 0 6px;font-size:14.5px}
.coach-card p{margin:0;color:var(--text);font-size:13px;line-height:1.55}
.coach-card .tag{display:inline-block;margin-bottom:8px;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--purple);background:#1c1428;padding:2px 8px;border-radius:20px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(3,6,3,.6);backdrop-filter:blur(3px);z-index:80;display:none}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(460px,94vw);background:linear-gradient(180deg,#0e130d,#0b0f0a);border-left:1px solid var(--line2);z-index:81;transform:translateX(100%);transition:.22s;overflow-y:auto;box-shadow:-30px 0 60px rgba(0,0,0,.5)}
.drawer.open{transform:none}
.dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;position:sticky;top:0;background:#0e130d;z-index:2}
.dh img{width:46px;height:46px;border-radius:50%;border:1px solid var(--line2);background:#0a0e09}.dh .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:20px}
.dsec{padding:16px 20px;border-bottom:1px solid var(--line)}.dsec h5{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.distbar{width:100%;height:90px}
.aibox{background:#0d120c;border:1px solid var(--line2);border-radius:10px;padding:12px;color:var(--muted);font-size:12.5px;line-height:1.6}
.aibox.filled{color:var(--text)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#16240f;color:var(--accent);border:1px solid #2c4218;padding:10px 18px;border-radius:10px;font-weight:700;font-size:12.5px;z-index:90;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(3,6,3,.7);backdrop-filter:blur(4px);z-index:95;display:none;align-items:center;justify-content:center}
.modal.open{display:flex}
.mbox{width:min(380px,92vw);background:linear-gradient(180deg,#101610,#0b0f0a);border:1px solid var(--line2);border-radius:16px;padding:24px}

async function detectMode(){try{const r=await fetch('./api/status',{cache:'no-store'});STATIC=!r.ok;}catch(e){STATIC=true;}}
async function staticApi(path){
  const [base,qs]=path.split('?'); const q=new URLSearchParams(qs||'');
  const J=f=>fetch(DATA_BASE+f+'?t='+Math.floor(Date.now()/60000)).then(r=>r.json()).catch(()=>({}));
  switch(base){
    case '/api/dashboard': return J('dashboard.json');
    case '/api/projections': return J(q.get('boosted')==='true'?'boosted.json':'projections.json');
    case '/api/model/health': return J('model_health.json');
    case '/api/backtest': return J('backtest.json');
    case '/api/model/drift': return J('drift.json');
    case '/api/optimizer/today': {
      // No live backend to re-query with different params, so pick the matching precomputed
      // file (see build_static.py) — one per sport for PrizePicks (the only book with a
      // real published payout table), one per unavailable book regardless of sport (the
      // result is the same unavailableReason either way).
      const book=(q.get('book')||'prizepicks').toLowerCase();
      const sport=(q.get('sport')||'all').toLowerCase();
      if(book!=='prizepicks')return J(`optimizer_${book}.json`);
      return J(sport==='all'?'optimizer.json':`optimizer_${sport}.json`);
    }
    case '/api/optimizer/books': return J('optimizer_books.json');
    case '/api/weather': return J('weather.json');
    case '/api/books': return J('books.json');
    case '/api/injuries': return J('injuries.json');
    case '/api/auth/status': return J('auth.json');
    case '/api/lines/history': {const h=await J('history.json');return {history:(h.history||{})[q.get('id')]||[]};}
    case '/api/analytics': {const a=await J('analytics.json');const k=(a.index||{})[q.get('id')];let an=k?(a.analytics||{})[k]:null;if(an&&an._r&&a.recent)an={...an,recent:a.recent[an._r]};return {analytics:an||{available:false}};}
    case '/api/ai/explain': return {ai:{available:false,reason:'AI Juice needs the live server. The static build shows fully model-driven projections.'}};
    case '/api/simulation': return {simulation:null,valuation:{available:false}};  // computed client-side in loadSim
    default: return {};
  }
}

function coachFallback(d,opt){
  const c=(d&&d.coach_context)||{};
  if(!c.total_priced_props_today)return 'Not enough live props yet to build a strategy read.';
  const bits=[`${c.props_80plus_juice} of ${c.total_priced_props_today} props (${c.pct_of_pool_80plus_juice}%) clear 80+ Juice today.`];
  if(c.pct_of_pool_80plus_juice<5)bits.push('That\'s a thinner slate than usual — play smaller and fewer entries, and be selective on Demon plays.');
  else if(c.pct_of_pool_80plus_juice>15)bits.push('That\'s a strong slate — the model has real conviction across more of the board than usual.');
  else bits.push('A fairly typical slate — size entries normally.');
  const best=opt&&opt.topEntries&&opt.topEntries[0];
  if(best)bits.push(`Best combo right now: ${best.format} (${Math.round(best.simulation.chanceOfProfit*100)}% chance of profit, ${pct(best.simulation.expectedROI*100)} expected ROI).`);
  return bits.join(' ');
}
// Dashboard re-renders every 60s (see the setInterval in boot()) and every render called
// loadCoach() with zero caching — a real Gemini call, unconditionally, per tick, per open
// tab. Gemini's free tier caps at 20 requests/MINUTE (measured live: every AI Juice call
// was 429ing with "generate_content_free_tier_requests, limit: 20"), so this alone could
// exhaust the app's entire shared quota with just a couple of tabs open, starving every
// other AI Juice caller too. Cache the result (success longer than failure, so a transient
// 429 doesn't get "stuck" for the full window once real capacity frees back up).
const _coachCache={};
const _COACH_OK_TTL=20*60*1000, _COACH_FAIL_TTL=5*60*1000;
async function loadCoach(d,opt){
  const box=$('#coachText');if(!box)return;
  // AI Juice now requires sign-in (real per-user daily quota — see main.py's
  // api_ai_explain/api_ai_coach). Anonymous visitors get the honest rule-based fallback
  // instead of a nagging "sign in" on every dashboard load — coachFallback is real,
  // number-grounded content, not a placeholder.
  if(!AUTH.token){box.className='';box.textContent=coachFallback(d,opt);return}
  const hit=_coachCache[sport];
  if(hit&&Date.now()-hit.t<hit.ttl){box.className='';box.textContent=hit.text;return}
  try{
    let ctx=d.coach_context||{};
    const best=opt&&opt.topEntries&&opt.topEntries[0];
    if(best)ctx={...ctx,best_entry_format:best.format,best_entry_quality_score:best.qualityScore,
      best_entry_expected_roi_pct:Math.round(best.simulation.expectedROI*1000)/10,
      best_entry_chance_of_profit_pct:Math.round(best.simulation.chanceOfProfit*1000)/10};
    const r=STATIC?await api('/api/ai/coach',{method:'POST',body:ctx})
                  :await api('/api/ai/coach?sport='+sport);
    const ok=!!(r.ai&&r.ai.available);
    const text=ok?r.ai.strategy:coachFallback(d,opt);
    box.className='';box.textContent=text;
    _coachCache[sport]={t:Date.now(),text,ttl:ok?_COACH_OK_TTL:_COACH_FAIL_TTL};
    loadAiUsage();
  }catch(e){box.className='';box.textContent=coachFallback(d,opt)}
}

function catsForSport(){
  const counts={};
  const pool=PF.lineMode==='normal'?PROJ:BOOSTED.filter(p=>p.oddsType===PF.lineMode);
  pool.forEach(p=>{
    if(PF.projSport!=='all' && (p.sport||'').toLowerCase()!==PF.projSport.toLowerCase())return;
    const s=(p.stat||'').trim(); if(s)counts[s]=(counts[s]||0)+1;
  });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]);   // [ [stat,count], ... ]
}

function togSrc(k,on){

function applyProj(){
  // Normal = the default priced (standard/boosted) pool. Demon/Goblin are a PrizePicks-only
  // lane (odds_type-filtered out of BOOSTED, which holds both) — never mixed with Normal.
  const base=PF.lineMode==='normal'?PROJ:BOOSTED.filter(p=>p.oddsType===PF.lineMode);
  let rows=base.filter(p=>PF.sources.has(p.source));
  if(PF.projSport!=='all')rows=rows.filter(p=>(p.sport||'').toLowerCase()===PF.projSport.toLowerCase());
  if(PF.catsOff.size)rows=rows.filter(p=>!PF.catsOff.has((p.stat||'').trim()));
  rows=rows.filter(p=>p.juiceScore>=PF.juiceMin && (p.confidence||0)>=PF.confMin && (p.edgePct==null||p.edgePct>=PF.edgeMin));
  if(PF.high)rows=rows.filter(p=>p.juiceScore>=80);
  if(PF.side!=='all')rows=rows.filter(p=>p.side===PF.side);
  if(PF.onlyWatch)rows=rows.filter(p=>isWatched(p.id));
  if(PF.q){const q=PF.q.toLowerCase();rows=rows.filter(p=>(p.player||'').toLowerCase().includes(q))}
  const key={juice:p=>p.juiceScore,edge:p=>p.edgePct??-999,confidence:p=>p.confidence||0,projection:p=>p.projection||0,line:p=>p.line??0,probability:p=>p.probability??0,player:p=>(p.player||'').toLowerCase(),opp:p=>(p.opponent||'').toLowerCase()}[PF.sort]||(p=>p.juiceScore);
  const dir=PF.dir||-1;
  rows.sort((a,b)=>{const ka=key(a),kb=key(b);const c=typeof ka==='string'?ka.localeCompare(kb):(ka-kb);return dir*c});
  $('#pcount').textContent=rows.length+' props';
  const per=PF.per,pages=Math.max(1,Math.ceil(rows.length/per)),pg=Math.min(PF.page,pages);PF.page=pg;
  const slice=rows.slice((pg-1)*per,pg*per);
  const th=(label,k)=>k?`<th class="sortable ${PF.sort===k?'sorted':''}" onclick="setSort('${k}')">${label}${PF.sort===k?`<span class="sortarrow">${dir<0?'↓':'↑'}</span>`:''}</th>`:`<th>${label}</th>`;
  const head=`<tr>${th('','')}${th('Player','player')}${th('Team','')}${th('Opp','opp')}${th('Prop','')}${th('Book','')}${th('Line','line')}${th('Proj','projection')}${th('EV %','edge')}${th('Juice','juice')}${th('Confidence','confidence')}${th('Over%','probability')}${th('AI','')}${th('','')}</tr>`;
  $('#ptable').innerHTML=`<table class="rtable"><thead>${head}</thead><tbody>${slice.map(richRow).join('')||'<tr><td colspan="14" class="empty">No props match these filters.</td></tr>'}</tbody></table>`;
  const from=rows.length?(pg-1)*per+1:0,to=Math.min(pg*per,rows.length);
  $('#ppager').innerHTML=`<span>Showing ${from}–${to} of ${rows.length}</span><span>${Array.from({length:pages},(_,i)=>i+1).slice(Math.max(0,pg-3),pg+2).map(n=>`<span class="qf ${n===pg?'on':''}" onclick="PF.page=${n};applyProj()">${n}</span>`).join(' ')}</span>`;
}

// Peter Acklam's rational approximation of the inverse standard normal CDF (probit).
// Accurate to ~1.15e-9 — plenty for a percentile table built on an already-approximate SD.
function normInv(p){
  if(p<=0)return -Infinity;if(p>=1)return Infinity;
  const a=[-3.969683028665376e1,2.209460984245205e2,-2.759285104469687e2,1.383577518672690e2,-3.066479806614716e1,2.506628277459239];
  const b=[-5.447609879822406e1,1.615858368580409e2,-1.556989798598866e2,6.680131188771972e1,-1.328068155288572e1];
  const c=[-7.784894002430293e-3,-3.223964580411365e-1,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783];
  const d=[7.784695709041462e-3,3.224671290700398e-1,2.445134137142996,3.754408661907416];
  const pl=0.02425;
  let q,r;
  if(p<pl){q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}
  if(p>1-pl){q=Math.sqrt(-2*Math.log(1-p));return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}
  q=p-0.5;r=q*q;
  return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}

function corrGraphSVG(){

function pfStats(entries){
  const settled=entries.filter(e=>e.status==='won'||e.status==='lost');
  const won=settled.filter(e=>e.status==='won').length,lost=settled.length-won;
  const pnl=won*0.9-lost;                       // flat 1u at ~ -110
  const avg=f=>{const v=entries.map(f).filter(x=>x!=null&&!isNaN(x));return v.length?v.reduce((s,x)=>s+ +x,0)/v.length:null};
  const grp=key=>{const m={};settled.forEach(e=>{const k=e[key]||'—';(m[k]=m[k]||{w:0,n:0}).n++;if(e.status==='won')m[k].w++});
    let best=null;for(const[k,v]of Object.entries(m))if(v.n>=2){const r=v.w/v.n;if(!best||r>best.rate)best={key:k,rate:r,n:v.n}}return best};
  let streak=0,dir=null;for(const e of [...settled].sort((a,b)=>_ts(b)-_ts(a))){if(dir==null){dir=e.status;streak=1}else if(e.status===dir)streak++;else break}
  return{total:entries.length,open:entries.filter(e=>e.status==='open').length,settled:settled.length,won,lost,
    winRate:settled.length?won/settled.length:null,pnl,roi:settled.length?pnl/settled.length:null,
    avgJuice:avg(e=>e.juiceScore),avgConf:avg(e=>e.confidence),bestSport:grp('sport'),bestProp:grp('stat'),streak,streakDir:dir};
}

function pfBars(groups){if(!groups.length)return '<div class="mv muted" style="padding:14px 16px">Not enough settled entries yet.</div>';
  return '<div style="padding:8px 16px 14px">'+groups.map(g=>{const r=g.n?Math.round(g.w/g.n*100):0;return `<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px"><span>${g.label} <span class="muted">${g.w}/${g.n}</span></span><b>${r}%</b></div><div style="height:7px;border-radius:4px;background:#1a2416;overflow:hidden"><i style="display:block;height:100%;width:${r}%;background:linear-gradient(90deg,${jColor(r)}aa,${jColor(r)})"></i></div></div>`}).join('')+'</div>';
}
function pfGroupBy(entries,key){const settled=entries.filter(e=>e.status==='won'||e.status==='lost'),m={};settled.forEach(e=>{const k=e[key]||'—';(m[k]=m[k]||{label:k,w:0,n:0}).n++;if(e.status==='won')m[k].w++});return Object.values(m).sort((a,b)=>b.n-a.n)}
const pfSportBars=e=>pfBars(pfGroupBy(e,'sport'));
const pfPropBars=e=>pfBars(pfGroupBy(e,'stat').slice(0,6));
function pfConfBars(entries){const settled=entries.filter(e=>e.status==='won'||e.status==='lost'),b=[['80+',c=>c>=80],['65–79',c=>c>=65&&c<80],['50–64',c=>c>=50&&c<65],['<50',c=>c<50]];
  return pfBars(b.map(([label,f])=>{const es=settled.filter(e=>f(e.confidence||0));return{label,w:es.filter(e=>e.status==='won').length,n:es.length}}).filter(x=>x.n));}
function pfPnlChart(entries){const settled=[...entries.filter(e=>e.status==='won'||e.status==='lost')].sort((a,b)=>_ts(a)-_ts(b));let cum=0;const pts=[0];settled.forEach(e=>{cum+=e.status==='won'?0.9:-1;pts.push(cum)});
  const W=420,H=120,pad=12,mn=Math.min(0,...pts),mx=Math.max(0,...pts),rng=(mx-mn)||1,X=i=>pad+i*(W-2*pad)/Math.max(1,pts.length-1),Y=v=>H-pad-((v-mn)/rng)*(H-2*pad);let d='';pts.forEach((v,i)=>d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1));
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:120px"><line x1="${pad}" y1="${Y(0)}" x2="${W-pad}" y2="${Y(0)}" stroke="#273222" stroke-dasharray="3 3"/><path d="${d}" fill="none" stroke="${cum>=0?'#8ee65a':'#ff6b6b'}" stroke-width="2.2"/><text x="${W-pad}" y="15" text-anchor="end" fill="${cum>=0?'#8ee65a':'#ff6b6b'}" font-size="11" font-weight="800">${signed(cum)}u</text></svg>`;
}

function pfExposure(entries){if(!entries.length)return pfEmpty();

}

function driftChip(status){
  if(status==='drifting')return `<span class="chip r">drifting</span>`;
  if(status==='stable')return `<span class="chip g">stable</span>`;
  return `<span class="chip">insufficient data</span>`;
}

// Reliability diagram: predicted P(over) vs realized frequency, per probability bucket.
// A perfectly calibrated model sits on the y=x diagonal; bowing below it = overconfident,
// above it = underconfident. Point size ~ bucket sample size.
function reliabilityChart(buckets){
  const W=280,H=280,pad=28;
  const X=p=>pad+p*(W-2*pad), Y=a=>H-pad-a*(H-2*pad);
  const pts=buckets.filter(b=>b.n>0);
  const maxN=Math.max(1,...pts.map(b=>b.n));
  const circles=pts.map(b=>{
    const r=3+9*Math.sqrt(b.n/maxN);
    const off=Math.abs(b.predicted-b.actual)>0.08;
    return `<circle cx="${X(b.predicted)}" cy="${Y(b.actual)}" r="${r.toFixed(1)}" fill="${off?'#ff6b6b':'#c6f24e'}" fill-opacity=".75" stroke="${off?'#ff6b6b':'#c6f24e'}" stroke-width="1"/>`;
  }).join('');
  const ticks=[0,0.25,0.5,0.75,1].map(t=>`<text x="${X(t)}" y="${H-8}" fill="#5c675a" font-size="8" text-anchor="middle">${t}</text><text x="${pad-6}" y="${Y(t)+3}" fill="#5c675a" font-size="8" text-anchor="end">${t}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:300px;height:auto">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${pad}" stroke="#2a3524" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#2a3524"/>
    <line x1="${pad}" y1="${H-pad}" x2="${pad}" y2="${pad}" stroke="#2a3524"/>
    ${ticks}${circles}
    <text x="${W/2}" y="${H-1}" fill="#8b978a" font-size="8" text-anchor="middle">predicted P(over)</text>
    <text x="8" y="${H/2}" fill="#8b978a" font-size="8" text-anchor="middle" transform="rotate(-90 8 ${H/2})">realized frequency</text>
  </svg>`;
}

// Daily-snapshot trend (backtest.record_run, once/day per sport — see main.py's maintenance
// loop): hit-rate over time, oldest→newest. Answers "is it improving or getting worse" at a
// glance, without needing to read a table of numbers.
function trendChart(runs,key,fmtFn){
  const rows=[...runs].reverse().filter(r=>r[key]!=null);
  if(rows.length<2)return '<div class="empty" style="padding:20px">Not enough recorded snapshots yet to chart a trend — one is recorded per sport per day.</div>';
  const W=520,H=110,pad=14;
  const vals=rows.map(r=>r[key]);
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=(mx-mn)||1;
  const X=i=>pad+i*(W-2*pad)/Math.max(1,rows.length-1), Y=v=>H-pad-((v-mn)/rng)*(H-2*pad);
  let d='';rows.forEach((r,i)=>d+=(i?'L':'M')+X(i)+' '+Y(r[key]));
  const last=rows[rows.length-1][key], first=rows[0][key];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:110px">
    <path d="${d}" fill="none" stroke="#c6f24e" stroke-width="2.2"/>
    ${rows.map((r,i)=>`<circle cx="${X(i)}" cy="${Y(r[key])}" r="2" fill="#c6f24e"/>`).join('')}
  </svg><div class="muted" style="font-size:11px;margin-top:2px">${fmtFn(first)} → <b style="color:var(--text)">${fmtFn(last)}</b> across ${rows.length} recorded snapshot${rows.length===1?'':'s'}</div>`;
}

// Colors for the REAL confidence components (from valuation.confidence_factors). No fake weights.
const CFCOL={'Sample Size':'#c6f24e','Decisiveness':'#5bd0c0','Method':'#7c9bff'};
const JFCOL={'Proj vs Line':'#6bd47a','Expected Value':'#c6f24e','Confidence':'#5bd0c0','Stability':'#7c9bff','Model Agreement':'#f2c94e','Market Quality':'#e07be0','Data Quality':'#9a9fa8'};
// 2026-07-30 Juice Score rebuild — deliberately NOT a re-skin of Confidence or EV (see
// valuation.py's juice_score docstring). This breakdown is what makes that legible: every
// prop's score is 7 real, independently-computed components, not one opaque decisiveness×
// confidence number.
function juiceBreakdown(x){
  const f=x.juiceFactors||[];
  if(!f.length)return '';
  const items=f.map(z=>[z.factor,z.value,JFCOL[z.factor]||'#5c675a']);
  return `<div class="dsec"><h5>What Makes This Prop Juicy</h5><div style="display:flex;align-items:center;gap:16px">${donutSVG(items,x.juiceScore,'Juice')}<div class="legend" style="flex:1">${f.map(z=>`<div class="row" title="${z.detail}"><span class="dot" style="background:${JFCOL[z.factor]||'#5c675a'}"></span>${z.factor}<span class="pct">${z.value} / ${z.max}</span></div>`).join('')}</div></div><p class="muted" style="font-size:10.5px;margin:8px 0 0">Juice Score ≠ Confidence and ≠ EV — it's a blend of both plus projection stability, model-vs-market agreement, cross-book coverage, line value, and data completeness.</p></div>`;
}
function donutSVG(items,center,sub){let a=-Math.PI/2,R=40,r=26,cx=42,cy=42,p='';const tot=items.reduce((s,x)=>s+x[1],0)||1;
  items.forEach(([_n,w,col],i)=>{const ang=w/tot*2*Math.PI,a2=a+ang,P=(rad,an)=>[cx+rad*Math.cos(an),cy+rad*Math.sin(an)];const[x1,y1]=P(R,a),[x2,y2]=P(R,a2),[x3,y3]=P(r,a2),[x4,y4]=P(r,a),lg=ang>Math.PI?1:0;p+=`<path d="M${x1} ${y1}A${R} ${R} 0 ${lg} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${lg} 0 ${x4} ${y4}Z" fill="${col}"/>`;a=a2});
  return `<svg width="84" height="84" viewBox="0 0 84 84">${p}<text x="42" y="45" text-anchor="middle" fill="#e9f0e6" font-size="15" font-weight="800">${center}</text><text x="42" y="57" text-anchor="middle" fill="#8b978a" font-size="7">${sub||''}</text></svg>`;
}
// Real confidence breakdown from the prop's own confidenceFactors (sum ≤100; grey = headroom).
function confBreakdown(x){
  const f=x.confidenceFactors||[];
  if(!f.length)return `<div class="dsec"><h5>Confidence</h5><div class="v" style="font-size:22px;font-weight:800">${Math.round(x.confidence)}%</div><p class="muted" style="font-size:10.5px;margin:6px 0 0">Blends sample size, decisiveness, and whether a full engine run backed it.</p></div>`;
  const items=f.map(z=>[z.factor,z.value,CFCOL[z.factor]||'#5c675a']);
  const sum=items.reduce((s,i)=>s+i[1],0),head=Math.max(0,100-sum);
  if(head>0.5)items.push(['Headroom',head,'#26311f']);
  return `<div class="dsec"><h5>What Drives This Confidence</h5><div style="display:flex;align-items:center;gap:16px">${donutSVG(items,Math.round(x.confidence)+'%','Confidence')}<div class="legend" style="flex:1">${f.map(z=>`<div class="row" title="${z.detail}"><span class="dot" style="background:${CFCOL[z.factor]||'#5c675a'}"></span>${z.factor}<span class="pct">${z.value} / ${z.max}</span></div>`).join('')}</div></div><p class="muted" style="font-size:10.5px;margin:8px 0 0">Real components of this prop's confidence score — not a fixed template.</p></div>`;
}
// Edge (raw Projection − Line) vs Expected Value (the calibrated-probability-based %) are
// DIFFERENT numbers with different meanings — shown together so neither is mistaken for
// the other. EV can be large on a small Edge for a lopsided-probability prop (a near-certain
// "under 0.5" home runs, say) — that's not a bug, see the "i" tooltip.
const EV_TIP='The estimated mathematical advantage based on Juiced\'s calibrated probability compared to the sportsbook\'s implied probability — not simply a percent of the projection\'s distance from the line.';
function edgeEvKV(x){
  const dp=dispProj(x);
  const edge=(dp!=null&&x.line!=null)?+(dp-x.line).toFixed(2):null;
  const evTitle=x.unpriced?'PrizePicks doesn\'t expose this boosted line\'s real payout multiplier, so EV can\'t be honestly computed.':EV_TIP;
  const evVal=x.unpriced?'<span class="muted" style="font-size:15px;font-weight:700">not priced</span>':pct(x.edgePct);
  const projTitle='The average of the model\'s mean and median projection — a single honest number instead of two that can disagree on a skewed stat (a bench player can average 0.6 while the TYPICAL game is 0).';
  return `<div class="kv">
    <div class="b" title="${projTitle}"><div class="l">Projection</div><div class="v">${fmt(dp)}</div></div>
    <div class="b"><div class="l">Line</div><div class="v">${fmt(x.line)} ${oddsTypeBadge(x)}</div></div>
    <div class="b" title="Projection − Line"><div class="l">Edge</div><div class="v ${edge>=0?'pos':'neg'}">${signed(edge)}</div></div>
    <div class="b" title="${evTitle}"><div class="l">Expected Value <span class="muted" style="cursor:help">ⓘ</span></div><div class="v ${x.unpriced?'':(x.edgePct>=0?'pos':'neg')}">${evVal}</div></div>
    <div class="b"><div class="l">Over / Under</div><div class="v" style="font-size:15px">${prob(x.probability)} / ${x.probability!=null?prob(1-x.probability):'—'}</div></div>
    <div class="b"><div class="l">Confidence</div><div class="v">${Math.round(x.confidence)}%</div></div>
  </div>`;
}
function whyBullets(x){const b=[];const over=(x.side||'over')==='over';
  if(x.projection!=null&&x.line!=null)b.push(`Model projects <b>${fmt(dispProj(x))}</b> vs a <b>${fmt(x.line)}</b> line — ${pct(x.edgePct)} edge`);
  if(x.probability!=null)b.push(`<b>${prob(over?x.probability:1-x.probability)}</b> model probability to ${x.side} the line`);
  if(x.confidence!=null)b.push(`<b>${Math.round(x.confidence)}%</b> confidence — ${x.confidence>=75?'high':x.confidence>=55?'moderate':'lower'} conviction`);
  if(x.proj_kind==='engine'||x.juiceScore)b.push(`Full Monte-Carlo engine run on recent game logs`);
  return b.slice(0,5);
}
// Only shown for H/R/RBI COMBO props, where these priors actually apply — and labeled as the
// model's defaults (shrunk toward the player's own game-log correlations at simulation time).
function corrHTML(x){const st=(x.stat||'');

}

   <div class="dsec" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ${isWatched(x.id)?'':'pri'}" id="wbtn" onclick='toggleWatch(${JSON.stringify(x).replace(/"/g,"&quot;")});renderDrawerBtns(${JSON.stringify(x).replace(/"/g,"&quot;")})'>${isWatched(x.id)?'Watching':'Add to Watchlist'}</button><button class="btn" onclick='addPlay(${JSON.stringify(x).replace(/"/g,"&quot;")})'>+ Portfolio</button><button class="btn" onclick='saveProp(${JSON.stringify(x).replace(/"/g,"&quot;")})'>${icon('star',13)} Save</button><button class="btn" onclick='loadResearch(${JSON.stringify(x).replace(/"/g,"&quot;")})'>${icon('research',13)} Research</button><button class="btn" onclick='compareBooks(${JSON.stringify(x).replace(/"/g,"&quot;")})'>${icon('layers',13)} Compare Books</button></div>
   <div class="dsec" id="cmpbox" style="display:none"></div>
   ${x.model_version?`<p class="muted" style="font-size:10.5px;padding:0 20px 16px;margin:0">Projected by model <b style="color:var(--text)">${x.model_version}</b>${x.data_snapshot?` on data as of ${x.data_snapshot}`:''} — <span style="color:var(--accent);font-weight:700;cursor:pointer" onclick="closeDrawer();MH_SPORT='${x.sport}';go('model-health')">see how this model version measures up →</span></p>`:''}`;
  loadSim(x);loadRecent(x);if(AUTH.ai)loadAIExplain(x);
  if(tab==='ai')setTimeout(()=>$('#aibox')&&$('#aibox').scrollIntoView({behavior:'smooth',block:'center'}),200);
}
function renderDrawerBtns(x){const b=$('#wbtn');if(b){b.className='btn '+(isWatched(x.id)?'':'pri');b.textContent=isWatched(x.id)?'Watching':'Add to Watchlist'}}
function addPlay(x){DATA.portfolio.add({line_id:x.id,player:x.player,sport:x.sport,team:x.team,stat_type:x.stat,side:x.side,line_value:x.line,juiceScore:x.juiceScore,confidence:x.confidence,source:x.source}).then(()=>toast('Added to portfolio'))}
async function loadSim(x,distSel='#dist',kvSel='#simkv'){try{const r=await api('/api/simulation?id='+encodeURIComponent(x.id));let s=r.simulation,v=r.valuation||{};
  if(!s){  // static build (no server): synthesize the distribution from the prop's own fields
    const mu=x.projection,lo=x.floor,hi=x.ceiling;
    const sd=(hi!=null&&lo!=null&&hi>lo)?(hi-lo)/2.5631:Math.max(0.5,Math.abs(mu||1)*0.5);
    s={mean:mu,floor:lo,ceiling:hi,overProbability:x.probability,
       underProbability:x.probability!=null?+(1-x.probability).toFixed(3):null,
       standardDeviation:+sd.toFixed(3),sd_is_approximate:true,sampleSize:null};
    v={available:x.edgePct!=null,side:x.side,
       expectedValue:x.edgePct!=null?x.edgePct/100:null,kellyFraction:null};
  }
  drawDist(s,x.line,distSel);
  const kv=$(kvSel);if(!kv)return;
  kv.innerHTML=`<div class="kv" style="margin-top:12px"><div class="b"><div class="l">Over Prob</div><div class="v">${prob(s.overProbability)}</div></div><div class="b"><div class="l">Floor–Ceiling</div><div class="v" style="font-size:15px">${fmt(s.floor)} – ${fmt(s.ceiling)}</div></div><div class="b"><div class="l">Expected Value</div><div class="v ${v.expectedValue>=0?'pos':'neg'}">${v.expectedValue!=null?(v.expectedValue*100).toFixed(1)+'%':'—'}</div></div><div class="b"><div class="l">Kelly Stake</div><div class="v">${v.kellyFraction!=null?(v.kellyFraction*100).toFixed(1)+'%':'—'}</div></div></div><p class="muted" style="font-size:11px;margin:10px 0 0">Favored side: <b style="color:var(--text)">${cap(v.side)}</b> · sample ${s.sampleSize||'—'} games · ${s.sd_is_approximate?'SD approximated from the p10–p90 band':''}</p>`;
}catch(e){const kv=$(kvSel);if(kv)kv.innerHTML='<p class="muted">Could not load simulation.</p>'}}
function drawDist(s,line,sel='#dist'){const S=$(sel);if(!S||s.mean==null)return;const mu=s.mean,sd=s.standardDeviation||Math.max(0.5,(s.ceiling-s.floor)/4)||1,W=420,H=90,lo=Math.min(s.floor??mu-3*sd,line),hi=Math.max(s.ceiling??mu+3*sd,line),X=v=>((v-lo)/((hi-lo)||1))*W;let bars='';const N=40;for(let i=0;i<N;i++){const v=lo+(i+.5)*(hi-lo)/N,y=Math.exp(-.5*((v-mu)/sd)**2),h=y*(H-14),over=v>line;bars+=`<rect x="${i*W/N}" y="${H-h}" width="${W/N-1}" height="${h}" fill="${over?'#c6f24e':'#3a4a30'}" opacity="${over?.85:.7}"/>`}
  S.innerHTML=bars+`<line x1="${X(line)}" y1="0" x2="${X(line)}" y2="${H}" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="3 3"/><text x="${X(line)+4}" y="12" fill="#ff6b6b" font-size="10" font-weight="700">line ${fmt(line)}</text>`}
// On static there's no server/DB to look up the prop by id, so pass the grounded context
// (only the prop's own numbers) to the Vercel function — it can't fabricate a stat.
function aiContext(x){const cf={};(x.confidenceFactors||[]).forEach(f=>cf[f.factor]=f);
  const m=cf['Sample Size']&&/(\d+)/.exec(cf['Sample Size'].detail||'');
  return {player:x.player,team:x.team,sport:x.sport,stat:x.stat,line:x.line,projection:x.projection,
    edge:x.edge,edgePct:x.edgePct,probability:x.probability,floor:x.floor,ceiling:x.ceiling,
    confidence:x.confidence,side:x.side,sample_games:m?+m[1]:null};}
async function loadAIExplain(x,sel='#aibox'){const box=$(sel);if(!box)return;
  if(!AUTH.token){box.className='aibox';box.textContent='Sign in to use AI Juice.';return}
  box.textContent='Generating a grounded explanation…';
  try{const r=STATIC?await api('/api/ai/explain',{method:'POST',body:aiContext(x)})
                    :await api('/api/ai/explain?id='+encodeURIComponent(x.id));
    if(r.ai&&r.ai.available){box.className='aibox filled';box.textContent=r.ai.explanation}
    else{box.className='aibox';box.textContent=(r.ai&&r.ai.reason)||'AI unavailable.'}
    loadAiUsage();
  }catch(e){box.textContent='AI request failed.'}}
// Real recent-games + hit-rate from /api/analytics (replaces the old raw-JSON dump).
async function loadRecent(x,sel='#recentbox'){const box=$(sel);if(!box)return;
  try{const r=await api('/api/analytics?id='+encodeURIComponent(x.id));const a=r.analytics||{};
    if(!a.available){box.innerHTML='<p class="muted" style="font-size:11.5px">No game logs for this prop yet — a full engine run needs recent games.</p>';return}
    const hr=a.hit_rate,rec=a.recent||[],line=x.line;
    const head=hr?`<div class="kv" style="margin-bottom:10px"><div class="b"><div class="l">Hit Rate vs ${fmt(hr.line)}</div><div class="v" style="font-size:16px">${hr.over_pct}% <span class="muted" style="font-size:11px">${hr.over}/${hr.n} over</span></div></div><div class="b"><div class="l">Last 5</div><div class="v" style="font-size:16px">${hr.last5_over}/${hr.last5_n} <span class="muted" style="font-size:11px">over</span></div></div></div>`:'';
    const rows=rec.slice(0,8).map(g=>{const v=g.prop_val,hit=(v!=null&&line!=null)?v>line:null;
      return `<tr><td class="muted">${g.date?g.date.slice(5):''}</td><td>${g.home?'vs':'@'} ${g.opp||''}</td><td class="mono" style="font-weight:700">${v??'—'}</td><td>${hit==null?'':hit?'<span class="chip g">over</span>':'<span class="chip r">under</span>'}</td></tr>`}).join('');
    const vsP=a.vs_pitcher&&a.vs_pitcher.pitcher?`<p class="muted" style="font-size:11px;margin:8px 0 0">Matchup: vs <b style="color:var(--text)">${a.vs_pitcher.pitcher.name}</b></p>`:'';
    box.innerHTML=head+(rows?`<table class="drops" style="margin:0"><thead><tr><th>Date</th><th>Opp</th><th>${(hr&&hr.stat)||x.stat||'Val'}</th><th></th></tr></thead><tbody>${rows}</tbody></table>${vsP}`:'<p class="muted" style="font-size:11.5px">No recent games on file.</p>');
  }catch(e){box.innerHTML='<p class="muted" style="font-size:11.5px">Could not load recent games.</p>'}}
function loadResearch(x){const b=$('#recentbox');if(b)b.scrollIntoView({behavior:'smooth',block:'center'})}
// Real cross-book comparison — same player+stat, whichever other books currently have it.
// Most props are single-book (verified: only ~8% of players appear on 2+ books this season),
// so an honest "no line elsewhere" result is the common, correct answer, not a failure.
async function compareBooks(x){const box=$('#cmpbox');if(!box)return;
  box.style.display='block';box.innerHTML='<h5>Compare Books</h5><p class="muted skel">Checking other books…</p>';
  try{
    const pr=await api('/api/projections?limit=8000');
    const others=(pr.projections||[]).filter(p=>p.player===x.player&&p.stat===x.stat&&p.source!==x.source);
    if(!others.length){box.innerHTML=`<h5>Compare Books</h5><p class="muted" style="font-size:11.5px">No other book currently has ${x.player} ${x.stat} listed.</p>`;return}
    const rows=[x,...others].sort((a,b)=>(a.source===x.source?-1:1));
    box.innerHTML=`<h5>Compare Books</h5><table class="drops" style="margin:0"><thead><tr><th>Book</th><th>Line</th><th>Proj</th><th>EV %</th></tr></thead><tbody>${rows.map(r=>`<tr ${r.source===x.source?'style="background:#101a0d"':''}><td>${bookLogo(r.source,18)} ${cap(r.source)}</td><td class="mono">${fmt(r.line)}</td><td class="mono">${fmt(r.projection)}</td><td class="mono ${r.edgePct>=0?'pos':'neg'}">${pct(r.edgePct)}</td></tr>`).join('')}</tbody></table>`;
  }catch(e){box.innerHTML='<h5>Compare Books</h5><p class="muted">Could not load other books.</p>'}}
function closeDrawer(){$('#scrim').classList.remove('open');$('#drawer').classList.remove('open');const was=SELID;SELID=null;if(was&&cur()==='projections'&&typeof applyProj==='function')try{applyProj()}catch(e){}}

// ── router ──
async function render(){renderNav();const r=cur();
  let fn=ROUTES[r],arg=null;
  if(!fn){const pm=r.match(/^player\/(.+)$/);if(pm){fn=vPlayerPage;arg=decodeURIComponent(pm[1])}}
  if(!fn){const gm=r.match(/^game\/(.+)$/);if(gm){fn=vGamePage;arg=decodeURIComponent(gm[1])}}
  fn=fn||vDashboard;
  $('#greet').style.display=r==='dashboard'?'':'none';$('#subgreet').style.display=r==='dashboard'?'':'none';
  try{await fn(arg)}catch(e){$('#view').innerHTML=`<div class="empty"><div class="em">${icon('warn',30,'var(--warn)')}</div>Could not load this page.<br><span class="muted">${e}</span><br><button class="btn pri" style="margin-top:14px" onclick="render()">Retry</button></div>`}}
window.addEventListener('hashchange',()=>{closeDrawer();closeSide();render()});
// 2026-08 fix: this used to target #f-stat, an element that never existed anywhere in
// this file (the real search input is #pq, rendered by vProjections) — so typing a query
// and hitting Enter silently navigated to Projections with the query dropped on the
// floor. PF.q is the actual filter state vProjections reads (line ~613) and applies via
// applyProj() on render, so setting it before navigating is enough — no DOM timing hack.
$('#globalsearch').addEventListener('keydown',e=>{if(e.key==='Enter'){PF.q=e.target.value;PF.page=1;go('projections')}});
// ⌘K / Ctrl+K focuses global search from anywhere (the hint shown next to the input was
// never actually wired to a listener).
window.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){
    e.preventDefault();
    const el=$('#globalsearch');
    if(el){el.focus();el.select()}
  }
});

// Real per-user daily AI Juice usage (server-enforced — main.py's /api/ai/usage or the
// static deploy's usage.js, same store.AiUsageRepository/Postgres table either way). "Off"
// only when AI isn't configured at all, "Sign in" when it is but there's no session, else
// the real used/limit for the viewer's own tier — never a made-up figure.
async function loadAiUsage(){
  const el=$('#aijuice-val');if(!el)return;
  if(!AUTH.ai){el.textContent='Off';return}
  if(!AUTH.token){el.textContent='Sign in';return}
  try{const u=await api('/api/ai/usage');el.textContent=(u&&u.signed_in)?`${u.used}/${u.limit}`:'Sign in';}
  catch(e){el.textContent='On'}
}
async function boot(){await detectMode();try{AUTH=await api('/api/auth/status')}catch(e){AUTH={}}
  // On static, auth.json can't know if the Vercel AI function has a key — probe it.
  if(STATIC){try{const s=await api('/api/ai/status');if(s&&typeof s.available==='boolean')AUTH.ai=s.available}catch(e){}}
  // Real Supabase auth when the server provides the public client config.
  if(AUTH.supabase_url && AUTH.supabase_anon_key && window.supabase){
    try{
      // PKCE flow returns ?code= (not a #hash token) so it never collides with the SPA's
      // hash router; supabase-js exchanges the code and cleans the URL automatically.
      SB=window.supabase.createClient(AUTH.supabase_url, AUTH.supabase_anon_key,
        {auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
      const {data}=await SB.auth.getSession(); setSession(data.session);
      let first=true;
      SB.auth.onAuthStateChange(async (ev,s)=>{setSession(s);await refreshWatched();renderAuthUI();await loadAiUsage();
        if(ev==='SIGNED_IN'&&!first){toast('Signed in');render()} first=false;});
    }catch(e){}
  }
  await refreshWatched();
  renderAuthUI();
  applyCollapsed();
  await loadAiUsage();
  if(!location.hash)location.hash='/dashboard';
  render();
  setInterval(()=>{if(cur()==='dashboard')render()},60000);
  // Live draft picks (10s, matches Sleeper draft cadence) — only while the Live Draft tab is
  // actually open; refreshLiveDraft() itself no-ops once you navigate away.
  setInterval(()=>refreshLiveDraft(false),10000);
}
document.addEventListener('click',e=>{if(!e.target.closest('#avatar')&&!e.target.closest('#umenu'))$('#umenu').classList.remove('open')});
// fill dashboard AI summary after render
// Grounded in the SAME numbers already on the page (data_health + the visible top drops) —
// no market-wide claim we can't back up (drops is only the top-12 slate, so counts here are
// scoped to "today's top picks", not "the whole board").
function aiBriefingText(){
  const d=DASH_D,dh=(d&&d.data_health)||{},drops=(d&&d.drops)||[];
  const hiJuice=drops.filter(x=>x.juiceScore>=80).length;
  const base=`Tracking ${(dh.projected_lines||0).toLocaleString()} projected props from ${dh.live_sources||0} live source${dh.live_sources===1?'':'s'} today`+
    (hiJuice?`, including ${hiJuice} of today's top picks at 80+ Juice`:'')+'.';
  return AUTH.ai ? base+' Open any prop for a grounded, cited AI explanation.'
                 : base+' AI-written recaps need an API key configured — every number here is still fully model-driven.';
}
const _r2=render;render=async function(){await _r2();if(cur()==='dashboard'){const p=$('#ai-summary');if(p){p.className='';p.textContent=aiBriefingText()}}};
boot();
</script>
