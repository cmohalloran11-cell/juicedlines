name: deploy site (github pages)

# Publishes the static site (the `static/` dir) to GitHub Pages — kept as a MANUAL BACKUP
# host for if Vercel breaks again (it froze once when the `data`-branch refreshes ate Vercel's
# free 100 deploys/day cap). Production currently serves from Vercel, so this is dispatch-only:
# it never runs automatically (no failure noise), but you can deploy Pages any time from the
# Actions tab → "deploy site (github pages)" → Run workflow. First run: set Settings → Pages →
# Source → GitHub Actions. Live data is read at runtime from the `data` branch via
# raw.githubusercontent (DATA_BASE in static/dashboard.html), independent of the host.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One site deploy at a time; queue (don't cancel) so a deploy always finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true      # turn Pages on via the API (build_type=workflow) — no manual toggle
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static            # serve the site shell; data comes from the `data` branch
      - id: deploy
        uses: actions/deploy-pages@v4
