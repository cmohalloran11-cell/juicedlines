name: test

# Runs the pytest suite (136+ tests across tests/, basketball/tests/, tennis/tests/) on
# every push and pull request. Added 2026-08: a production-readiness audit found the repo
# had real test coverage but NOTHING ran it automatically — a regression could reach `main`
# (and auto-deploy to production via deploy-prod.yml) with zero test gate. This workflow is
# the general CI status check (visible on PRs); deploy-prod.yml additionally runs the same
# suite as a hard gate before it will trigger the production deploy hook.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest -q
      - name: Dependency vulnerability scan (pip-audit)
        # Non-blocking (continue-on-error): a newly-disclosed CVE in a dependency shouldn't
        # suddenly block deploying an unrelated, urgent fix. This surfaces known
        # vulnerabilities in the run log/summary for visibility; Dependabot (see
        # .github/dependabot.yml) is what actually opens the upgrade PRs.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || echo "::warning::pip-audit found known vulnerabilities -- see output above. Non-blocking; review and update requirements.txt when convenient."
